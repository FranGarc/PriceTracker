[versions]


agp = "8.10.1"
kotlin = "2.0.21"
coreKtx = "1.16.0"
junit = "4.13.2"
ksp = "2.0.20-1.0.25"
hilt = "2.56.2"

espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.9.2"
activityCompose = "1.11.0"
composeBom = "2025.10.00"
infoCukes = "1.2.6"
androidTestRules = "1.0.2"
jupiter = "6.0.0"
appcompat = "1.7.1"
material = "1.12.0"
archUnit = "1.4.1"
instancio = "5.5.1"
mockito = "4.8.0"
assertj = "3.27.6"

ioCucumber = "7.14.0"
androidxRules = "1.7.0"
junitVersion = "1.3.0"
espressoCoreVersion = "3.7.0"
junit5Plugin = "1.14.0.0"
testRunner = "1.7.0"


[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }


#buildSrc
android-tools-build-gradle = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
jetbrains-kotlin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }


# testImplementation
junit-jupiter-aggregator = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "jupiter" }
junit-jupiter-api = { group = "org.junit.jupiter", name = "junit-jupiter-api", version.ref = "jupiter" }
junit-jupiter-params = { group = "org.junit.jupiter", name = "junit-jupiter-params", version.ref = "jupiter" }
#testRuntimeOnly
junit-jupiter-engine = { group = "org.junit.jupiter", name = "junit-jupiter-engine", version.ref = "jupiter" }







# androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }


#testCompile
assertj = { group = "org.assertj", name = "assertj-core", version.ref = "assertj" }
# testImplementation
mockito = { group = "org.mockito", name = "mockito-core", version.ref = "mockito" }
instancio = { group = "org.instancio", name = "instancio-junit", version.ref = "instancio" }
archunit = { group = "com.tngtech.archunit", name = "archunit-junit5", version.ref = "archUnit" }
#archunit = { group = "com.tngtech.archunit", name = "archunit-junit", version.ref = "archUnit" }
archunit-engine = { group = "com.tngtech.archunit", name = "archunit-junit5-engine-kotlin", version.ref = "archUnit" }
archunit-api = { group = "com.tngtech.archunit", name = "archunit-junit5-api", version.ref = "archUnit" }

# androidTestImplementation
info-cukes-cucumber-android = { group = "info.cukes", name = "cucumber-android", version.ref = "infoCukes" }
info-cukes-cucumber-junit = { group = "info.cukes", name = "cucumber-junit", version.ref = "infoCukes" }
android-support-test-rules = { group = "com.android.support.test", name = "rules", version.ref = "androidTestRules" }
io-cucumber-android = { group = "io.cucumber", name = "cucumber-android", version.ref = "ioCucumber" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "testRunner" }
androidx-test-rules = { group = "androidx.test", name = "rules", version.ref = "androidxRules" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCoreVersion" }

## dependency injection
# Hilt
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }


# root dependency
android-junit5 = { group = "de.mannodermaus.gradle.plugins", name = "android-junit5", version.ref = "junit5Plugin" }

[plugins]
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
android-junit5 = { id = "de.mannodermaus.android-junit5", version.ref = "junit5Plugin" }

android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "agp" }

